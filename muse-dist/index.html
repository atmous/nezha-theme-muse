<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse · Nezha</title>
<meta name="description" content="Muse — if Apple made a Nezha frontend.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2330d158'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span><h1 id="siteName">Muse</h1></div>
  <label class="search">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" type="search" placeholder="搜索服务器" autocomplete="off" spellcheck="false">
    <kbd>⌘K</kbd>
  </label>
  <button id="themeBtn" class="icon-btn" type="button" aria-label="切换深色 / 浅色">◐</button>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <p class="hero-eyebrow" id="heroEyebrow">正在连接…</p>
    <h2 id="heroTitle">正在连接</h2>
    <p class="hero-sub" id="heroSub">正在获取服务器状态</p>
  </section>

  <p id="emptyHint" class="hint" hidden>没有匹配的服务器。</p>
  <p id="errorHint" class="hint error" hidden></p>

  <section class="list" id="serverList" aria-live="polite"></section>

  <footer class="foot">
    <span>Muse · 如果苹果来做这个产品</span>
    <span id="footClock"></span>
  </footer>
</main>

<aside id="detail" class="detail" aria-hidden="true" role="dialog" aria-label="服务器详情">
  <div class="detail-grip" aria-hidden="true"></div>
  <div class="detail-head">
    <div>
      <h2 id="dName">–</h2>
      <p id="dSub">–</p>
    </div>
    <button id="detailClose" class="icon-btn" type="button" aria-label="关闭详情">✕</button>
  </div>
  <div class="detail-body">
    <div class="big-metric">
      <p class="big-label" id="dBigLabel">CPU</p>
      <p class="big-value"><span id="dBigValue">–</span><span class="big-unit" id="dBigUnit">%</span></p>
      <div class="segmented" id="metricSeg" role="group" aria-label="切换指标">
        <button type="button" data-metric="cpu" class="active">CPU</button>
        <button type="button" data-metric="mem">内存</button>
        <button type="button" data-metric="net">网络</button>
      </div>
    </div>
    <div class="chart-box">
      <canvas id="chartMain" width="640" height="220"></canvas>
      <p class="chart-cap" id="chartCap">实时曲线 · 最近 10 分钟</p>
    </div>
    <div class="d-list" id="dInfo"></div>
    <div class="d-history">
      <h3>24 小时 <span id="dHistNote"></span></h3>
      <canvas id="chartHist" width="640" height="120"></canvas>
      <p id="dHistEmpty" class="hint" hidden>面板未开启历史存储（tsdb），暂无 24 小时数据。</p>
    </div>
  </div>
</aside>
<div id="detailBackdrop" class="backdrop" hidden></div>

<script src="./assets/app.js"></script>
</body>
</html>
