<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse · Nezha</title>
<meta name="description" content="Muse — an aurora glass frontend for Nezha Monitoring.">
<meta name="theme-color" content="#070810" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23818cf8'/%3E%3Cstop offset='.5' stop-color='%23c084fc'/%3E%3Cstop offset='1' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="orb orb-4"></span>
</div>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1 id="siteName">Muse</h1><span class="brand-sub">Nezha</span></div>
  <div class="topbar-right">
    <span id="connDot" class="conn" title="与面板的连接状态"><i></i><em id="connText">连接中…</em></span>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
    </label>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="切换深色 / 浅色">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="verdict" aria-label="系统状态">
    <h2 id="verdictLine">正在连接…</h2>
    <p id="verdictSub">–</p>
  </section>

  <div class="list-head">
    <span id="listCount">服务器</span>
    <label class="sort">
      <span>排序</span>
      <select id="sortSelect" aria-label="排序方式">
        <option value="status">状态优先</option>
        <option value="cpu">CPU 高到低</option>
        <option value="mem">内存 高到低</option>
        <option value="name">名称 A–Z</option>
      </select>
    </label>
  </div>

  <p id="emptyHint" class="hint" hidden>没有匹配的服务器。</p>
  <p id="errorHint" class="hint error" hidden></p>

  <section id="serverList" class="server-list" aria-label="服务器列表"></section>

  <footer class="foot">
    <span>Muse · Aurora — 流动光晕与玻璃质感</span>
    <span id="footClock"></span>
  </footer>
</main>

<aside id="detail" class="detail" aria-hidden="true" role="dialog" aria-label="服务器详情">
  <div class="detail-head">
    <div>
      <p class="d-eyebrow" id="dEyebrow">服务器</p>
      <h2 id="dName">–</h2>
      <p id="dSub">–</p>
    </div>
    <button id="detailClose" class="icon-btn" type="button" aria-label="关闭详情">✕</button>
  </div>
  <div class="detail-body">
    <div class="d-kpis">
      <div class="d-kpi"><label>CPU</label><b id="dCpuBig">–</b></div>
      <div class="d-kpi"><label>内存</label><b id="dMemBig">–</b></div>
      <div class="d-kpi"><label>上传</label><b id="dNetUpBig">–</b></div>
      <div class="d-kpi"><label>下载</label><b id="dNetDownBig">–</b></div>
    </div>
    <div class="segmented" id="metricSeg" role="group" aria-label="切换指标">
      <button type="button" data-metric="cpu" class="active">CPU</button>
      <button type="button" data-metric="mem">内存</button>
      <button type="button" data-metric="net">网络</button>
    </div>
    <div class="chart-box">
      <canvas id="chartMain" width="640" height="200"></canvas>
      <p class="chart-cap" id="chartCap">实时曲线 · 最近 10 分钟</p>
    </div>
    <div class="d-list" id="dInfo"></div>
    <div class="d-history">
      <h3>24 小时 CPU 历史 <span id="dHistNote"></span></h3>
      <canvas id="chartHist" width="640" height="120"></canvas>
      <p id="dHistEmpty" class="hint" hidden>面板未开启历史存储（tsdb），暂无 24 小时数据。</p>
    </div>
  </div>
</aside>
<div id="detailBackdrop" class="backdrop" hidden></div>

<script src="./assets/app.js"></script>
</body>
</html>
