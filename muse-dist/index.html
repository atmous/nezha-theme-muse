<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse · Nezha</title>
<meta name="description" content="Muse — a refined monitoring frontend for Nezha, in the spirit of Linear, Stripe and Vercel.">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c7cff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1 id="siteName">Muse</h1><span class="brand-sub">Nezha</span></div>
  <div class="topbar-right">
    <span id="connDot" class="conn" title="与面板的连接状态"><i></i><em id="connText">连接中…</em></span>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
    </label>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="切换深色 / 浅色">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="page-head">
    <div>
      <h2>服务器</h2>
      <p id="pageSub">正在连接…</p>
    </div>
    <p class="live-clock" id="clock">--:--:--</p>
  </section>

  <section class="kpis" aria-label="关键指标">
    <div class="kpi primary"><label>在线服务器</label><b id="kpiOnline">–</b><span id="kpiOnlineSub">–</span></div>
    <div class="kpi"><label>平均 CPU</label><b id="kpiCpu">–</b><span id="kpiCpuSub">在线服务器</span></div>
    <div class="kpi"><label>平均内存</label><b id="kpiMem">–</b><span id="kpiMemSub">在线服务器</span></div>
    <div class="kpi"><label>总流量</label><b id="kpiNet">–</b><span id="kpiNetSub">实时上下行之和</span></div>
    <div class="kpi"><label>告警</label><b id="kpiAlerts">–</b><span id="kpiAlertsSub">离线服务器</span></div>
  </section>

  <section class="hero-chart" aria-label="舰队 CPU 趋势">
    <div class="hero-chart-head">
      <h3>舰队 CPU <span id="heroCpuNow"></span></h3>
      <span class="hero-chart-cap">实时 · 最近 10 分钟</span>
    </div>
    <canvas id="chartFleet" width="1200" height="220"></canvas>
  </section>

  <p id="emptyHint" class="hint" hidden>没有匹配的服务器。</p>
  <p id="errorHint" class="hint error" hidden></p>

  <section class="table-wrap">
    <table class="server-table" id="serverTable">
      <thead>
        <tr>
          <th data-sort="name" class="sortable">服务器</th>
          <th data-sort="status" class="sortable">状态</th>
          <th data-sort="cpu" class="sortable num">CPU</th>
          <th data-sort="mem" class="sortable num">内存</th>
          <th data-sort="disk" class="sortable num hide-md">磁盘</th>
          <th data-sort="net" class="sortable num">网络 ↑</th>
          <th class="num hide-md">网络 ↓</th>
          <th class="num hide-md">负载</th>
          <th data-sort="uptime" class="sortable num hide-md">运行时间</th>
        </tr>
      </thead>
      <tbody id="serverTbody"></tbody>
    </table>
  </section>

  <footer class="foot">
    <span>Muse · Linear / Stripe / Vercel 式克制设计</span>
    <span id="footClock"></span>
  </footer>
</main>

<aside id="detail" class="detail" aria-hidden="true" role="dialog" aria-label="服务器详情">
  <div class="detail-head">
    <div>
      <p class="d-eyebrow" id="dEyebrow">服务器</p>
      <h2 id="dName">–</h2>
      <p id="dSub">–</p>
    </div>
    <button id="detailClose" class="icon-btn" type="button" aria-label="关闭详情">✕</button>
  </div>
  <div class="detail-body">
    <div class="d-kpis">
      <div class="d-kpi"><label>CPU</label><b id="dCpuBig">–</b></div>
      <div class="d-kpi"><label>内存</label><b id="dMemBig">–</b></div>
      <div class="d-kpi"><label>上传</label><b id="dNetUpBig">–</b></div>
      <div class="d-kpi"><label>下载</label><b id="dNetDownBig">–</b></div>
    </div>
    <div class="segmented" id="metricSeg" role="group" aria-label="切换指标">
      <button type="button" data-metric="cpu" class="active">CPU</button>
      <button type="button" data-metric="mem">内存</button>
      <button type="button" data-metric="net">网络</button>
    </div>
    <div class="chart-box">
      <canvas id="chartMain" width="640" height="200"></canvas>
      <p class="chart-cap" id="chartCap">实时曲线 · 最近 10 分钟</p>
    </div>
    <div class="d-list" id="dInfo"></div>
    <div class="d-history">
      <h3>24 小时 CPU 历史 <span id="dHistNote"></span></h3>
      <canvas id="chartHist" width="640" height="120"></canvas>
      <p id="dHistEmpty" class="hint" hidden>面板未开启历史存储（tsdb），暂无 24 小时数据。</p>
    </div>
  </div>
</aside>
<div id="detailBackdrop" class="backdrop" hidden></div>

<script src="./assets/app.js"></script>
</body>
</html>
